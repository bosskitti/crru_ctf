<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="paraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#cc1100"/>
    </linearGradient>
  </defs>
  <!-- Rounded Apple-like icon container -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,59,48,0.4)" stroke-width="2"/>
  <!-- Two Red Parallel Bars -->
  <rect x="25" y="20" width="10" height="40" rx="5" fill="url(#paraGrad)"/>
  <rect x="45" y="20" width="10" height="40" rx="5" fill="url(#paraGrad)"/>
</svg>