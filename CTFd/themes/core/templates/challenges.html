{% extends "base.html" %}

{% block content %}
<style>
  .challenge-button {
    background: rgba(12, 15, 29, 0.85) !important;
    border: 1px solid var(--border-accent) !important;
    color: var(--text-main) !important;
    transition: all 0.2s ease !important;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3) !important;
    clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px)) !important;
    position: relative !important;
  }
  
  .challenge-button:hover {
    border-color: var(--accent-cyan) !important;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3) !important;
    transform: translateY(-2px) !important;
    color: #ffffff !important;
  }

  .challenge-button p {
    font-size: 1.1rem !important;
    font-weight: 800 !important;
    margin-bottom: 0.5rem !important;
    font-family: 'Outfit', sans-serif !important;
    text-transform: uppercase !important;
  }

  .challenge-button span {
    font-size: 0.9rem !important;
    font-weight: 700 !important;
    color: var(--accent-cyan) !important;
    font-family: 'JetBrains Mono', monospace !important;
  }

  /* Solved challenges */
  .challenge-solved {
    border-color: var(--accent-green) !important;
    background: rgba(0, 255, 102, 0.05) !important;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.1) !important;
  }
  .challenge-solved:hover {
    border-color: var(--accent-green) !important;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.3) !important;
  }
  .challenge-solved span {
    color: var(--accent-green) !important;
  }
  .challenge-solved .challenge-inner::after {
    content: "[SOLVED]";
    display: block;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 0.75rem !important;
    color: var(--accent-green) !important;
    font-weight: 700 !important;
    margin-top: 0.5rem !important;
    letter-spacing: 0.05em !important;
  }

  /* Category headers styling */
  .category-header h3 {
    font-family: 'JetBrains Mono', monospace !important;
    font-weight: 800 !important;
    color: var(--accent-cyan) !important;
    border-left: 4px solid var(--accent-pink) !important;
    padding-left: 0.75rem !important;
    letter-spacing: 0.05em !important;
    text-transform: uppercase !important;
  }
  .category-header h3::before {
    content: "[// ";
    color: var(--accent-pink) !important;
  }
  .category-header h3::after {
    content: " ]";
    color: var(--accent-pink) !important;
  }
</style>

  <div class="jumbotron">
    <div class="container">
      <h1>
        {% trans %}Challenges{% endtrans %}
      </h1>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div 
      x-data="ChallengeBoard" 
      @load-challenges.window="loadChallenges()" 
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="(category, idx) in getCategories().filter(cat => cat.toLowerCase() !== 'hidden' && cat.toLowerCase() !== 'tutorial')" :key="idx">
          <div class="pt-5">
            <div class="category-header mb-3">
              <h3 x-text="category"></h3>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                    <button
                        class="challenge-button btn btn-dark w-100 h-100"
                        :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >

                      <div class="challenge-inner my-3">
                        <p x-text="c.name"></p>
                        <span x-text="c.value"></span>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
