worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Rate limiting zones
  # 1. For the main CTFd platform: Max 30 requests per second per IP, with a burst of 60
  limit_req_zone $binary_remote_addr zone=ctfd_limit:10m rate=30r/s;

  # 2. For student challenge containers (*.crrulearnctf.xyz): Increased ~3.5x for classroom NAT IPs (120r/s, burst 200)
  limit_req_zone $binary_remote_addr zone=chall_limit:10m rate=120r/s;

  # Return HTTP 429 Too Many Requests instead of HTTP 503 Service Unavailable
  limit_req_status 429;

  # Configuration containing list of application servers
  upstream app_servers {
    server ctfd:8000;
  }

  # Wildcard server block for challenge containers routed via FRP
  server {
    listen 80;
    server_name *.crrulearnctf.xyz;

    location / {
      # Apply challenge rate limiting (Increased 3.5x: 120r/s, burst 200)
      limit_req zone=chall_limit burst=200 nodelay;

      proxy_pass http://frps:80;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      
      # Enable WebSocket support & 30-minute Keep-alive timeouts (1800s)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
  }

  # Main CTFd platform server block (Default Server)
  server {
    listen 80 default_server;
    server_name crrulearnctf.xyz;

    gzip on;
    client_max_body_size 4G;

    # Handle Server Sent Events for Notifications (Exclude from rate limit to prevent connection dropping)
    location /events {
      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
    }

    # Proxy connections to the application servers
    location / {
      # Apply CTFd platform rate limiting
      limit_req zone=ctfd_limit burst=60 nodelay;

      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
    }
  }
}
